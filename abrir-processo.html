<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="./theme.js?v=20260903a"></script>
<script src="./theme.js?v=20260903b"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#c8102e">
<title>Abrir Novo Processo | Costalog</title>
<style>
:root{--red:#c8102e;--red2:#a90d27;--bg:#f4f6f8;--ink:#17191c;--muted:#747b83;--line:#e5e8ec;--white:#fff;--green:#16844b;--shadow:0 12px 35px rgba(20,25,30,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}a{text-decoration:none;color:inherit}
.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:15px}.brand img{width:150px;height:42px;object-fit:contain}.brand .divider{height:28px;width:1px;background:#ddd}.brand strong{font-size:14px}.back{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;font-weight:800;font-size:12px;cursor:pointer}.back:hover{border-color:#e4b5be;color:var(--red)}
.wrap{max-width:1500px;margin:auto;padding:28px}.hero{background:linear-gradient(110deg,#b90f2b,#d51b3b);color:#fff;border-radius:18px;padding:27px 30px;display:flex;justify-content:space-between;align-items:center;gap:25px;box-shadow:0 14px 32px rgba(200,16,46,.16)}.hero h1{margin:0 0 7px;font-size:28px}.hero p{margin:0;color:rgba(255,255,255,.82);font-size:13px}.secure{font-size:11px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);padding:9px 12px;border-radius:9px;white-space:nowrap}
.upload{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:var(--shadow)}.drop{border:2px dashed #e2aab4;border-radius:14px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff9fa;cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:var(--red);background:#fff3f5}.drop-icon{font-size:32px;margin-bottom:8px}.drop strong{font-size:15px}.drop span{font-size:12px;color:#8a9097;margin-top:6px}.file-input{display:none}.files{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.file{display:flex;align-items:center;gap:8px;background:#f6f7f8;border:1px solid var(--line);padding:8px 10px;border-radius:9px;font-size:11px}.file button{border:0;background:none;color:#9a9fa5;cursor:pointer}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:17px}.primary{border:0;background:linear-gradient(135deg,#d51636,#a90c27);color:#fff;padding:12px 19px;border-radius:10px;font-weight:850;cursor:pointer;box-shadow:0 10px 22px rgba(200,16,46,.2)}.primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}.secondary{border:1px solid var(--line);background:#fff;padding:12px 17px;border-radius:10px;font-weight:800;cursor:pointer}
.status{display:none;margin-top:15px;padding:13px 15px;border-radius:10px;font-size:12px;line-height:1.5}.status.show{display:block}.status.info{background:#f3f6fa;color:#59636d}.status.error{background:#fff0f2;color:#a20b25}.status.ok{background:#eaf8f0;color:#176e43}
.result{margin-top:22px;display:none}.result.show{display:block}.result-head{display:flex;align-items:end;justify-content:space-between;margin:0 0 12px}.result-head h2{font-size:18px;margin:0}.result-head span{font-size:11px;color:#858b92}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}.field-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.field-name{font-size:11px;font-weight:850;color:#4c535b}.field-actions{display:flex;gap:5px}.icon-btn{width:31px;height:31px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:#616870;display:grid;place-items:center;font-size:14px}.icon-btn:hover{border-color:#dfadb6;color:var(--red);background:#fff8f9}.value{margin-top:9px;min-height:35px;display:flex;align-items:center;background:#f7f8f9;border:1px solid #edf0f2;border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.35;word-break:break-word}.value.empty{color:#9da3aa;font-style:italic}.confidence{font-size:9px;font-weight:800;margin-top:7px;color:var(--green)}.warning{font-size:10px;color:#9b6500;background:#fff7e7;padding:10px;border-radius:8px;margin-top:8px}.modal{display:none;position:fixed;inset:0;background:rgba(8,10,12,.72);z-index:50;padding:20px}.modal.show{display:flex;flex-direction:column}.modalbar{height:54px;background:#fff;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 15px}.modalbar strong{font-size:13px}.close{border:0;background:#f1f2f3;border-radius:8px;width:34px;height:34px;cursor:pointer}.viewer{flex:1;background:#d9dde1;border-radius:0 0 12px 12px;overflow:auto;display:flex;justify-content:center;padding:30px}.page{position:relative;display:inline-block;box-shadow:0 12px 35px rgba(0,0,0,.2);margin-bottom:30px;background:#fff}.page canvas{display:block;max-width:none}.highlight{position:absolute;border:3px solid #ff2d3d;background:rgba(255,60,75,.18);box-shadow:0 0 0 4px rgba(255,255,255,.75),0 0 22px rgba(255,35,55,.7);pointer-events:none;border-radius:3px}.page-label{position:absolute;top:-27px;left:0;background:#ff2d3d;color:#fff;font-size:10px;font-weight:800;padding:5px 8px;border-radius:6px}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.88);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}.loading.show{display:flex}.spinner{width:32px;height:32px;border:3px solid #eee;border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}.loading span{font-size:12px;color:#666}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:850px){.wrap{padding:17px}.top{padding:0 17px}.brand .divider,.brand strong{display:none}.hero{display:block;padding:22px}.secure{display:inline-block;margin-top:14px}.fields{grid-template-columns:1fr}.upload{padding:15px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img class="costalog-logo" src="Design sem nome (44) - Copia - Copia.png" alt="COSTALOG"><div class="divider"></div><strong>Abrir novo processo</strong></div><button class="back" onclick="location.href='inicio.html'">← Voltar para início</button></header>
<main class="wrap">
<section class="hero"><div><h1>Importar processo</h1><p>Envie um ou mais PDFs. A IA fará a leitura, organizará os dados e mostrará a origem de cada informação.</p></div><div class="secure">🔒 Leitura assistida por IA</div></section>
<section class="upload"><label class="drop" id="drop" for="pdfInput"><div class="drop-icon">📄</div><strong>Arraste os PDFs aqui ou clique para selecionar</strong><span>PDFs de processos • você pode selecionar vários arquivos</span></label><input id="pdfInput" class="file-input" type="file" accept="application/pdf" multiple><div class="files" id="files"></div><div class="actions"><button class="secondary" id="clearBtn" type="button">Limpar</button><button class="primary" id="analyzeBtn" type="button" disabled>✦ Analisar processo com IA</button></div><div class="status" id="status"></div></section>
<section class="result" id="result"><div class="result-head"><div><h2>Informações extraídas</h2><span>Ordem baseada no formulário operacional de referência</span></div><button class="secondary" id="copyAll" type="button">Copiar tudo</button></div><div class="fields" id="fields"></div></section>
</main>
<div class="modal" id="modal"><div class="modalbar"><strong id="modalTitle">Origem da informação</strong><button class="close" id="closeModal">✕</button></div><div class="viewer" id="viewer"></div></div>
<div class="loading" id="loading"><div class="spinner"></div><span id="loadingText">Preparando análise...</span></div>
<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
const AI_ENDPOINT='/api/extract-process';
const FIELDS=[
['process_number','Nº Processo'],['client','Cliente'],['document_type','Tipo Documento'],['transport_operation','Operação de Transporte'],['terminal_service','Serviço de Terminal?'],['release_billing_date','Data de Liberação para Faturamento Processo'],['closing_date','Data de Encerramento'],['client_reference','Ref. do cliente'],['document_number','Nº Documento'],['reservation_number','Nº Reserva'],['product','Produto'],['chemical_product','Produto químico?'],['shipper','Remetente'],['pickup_location','Local de Coleta'],['shipping_agency','Agência Marítima'],['customs_broker','Despachante'],['broker_reference','Ref. Despachante'],['bl_awb','Nº BL / AWB'],['consignee','Destinatário'],['delivery_location','Local de Entrega'],['ship','Navio'],['voyage_number','Nº Viagem Navio'],['origin_port','Porto Origem'],['maritime_operation','Operação Marítima'],['pickup_deadline','Prazo Coleta'],['delivery_deadline','Prazo Entrega'],['storage_deadline','Prazo vencimento armazenagem'],['demurrage_date','Data Demurrage'],['containerized_cargo','Carga com Container?'],['container_model','Modelo Container'],['empty_return_deadline','Prev. Ret/Dev Vazio'],['empty_container_terminal','Terminal do Container Vazio'],['loading_quantity','Qtd. Carregamento'],['process_billed','Processo Faturado'],['billing_started','Faturamento Iniciado'],['estimated_billing_value','Valor Previsto a Faturar'],['estimated_payment_value','Valor Previsto a Pagar'],['checklist','Checklist'],['observation','Observação'],['show_turns','Mostrar Viras?'],['route','Rota'],['storage_location','Local de Armazenagem'],['generate_empty_turn','Gerar Vira Vazio'],['generate_full_turn','Gerar Vira Cheio']
];
let files=[];let extracted=null;
const $=id=>document.getElementById(id), input=$('pdfInput'), drop=$('drop'), fileList=$('files'), analyze=$('analyzeBtn'), status=$('status'), result=$('result'), fields=$('fields'), loading=$('loading');
function showStatus(t,c='info'){status.textContent=t;status.className='status show '+c}
function renderFiles(){fileList.innerHTML=files.map((f,i)=>`<div class="file">📄 ${escapeHtml(f.name)} <button type="button" data-remove="${i}">✕</button></div>`).join('');analyze.disabled=!files.length;fileList.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.remove,1);renderFiles()})}
function addFiles(list){for(const f of list){if(f.type==='application/pdf' && !files.some(x=>x.name===f.name&&x.size===f.size))files.push(f)}renderFiles();showStatus(files.length?`${files.length} PDF(s) pronto(s) para análise.`:'Selecione pelo menos um PDF.','info')}
input.onchange=e=>addFiles(e.target.files);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
$('clearBtn').onclick=()=>{files=[];extracted=null;input.value='';renderFiles();result.classList.remove('show');showStatus('Seleção limpa.','info')};
function escapeHtml(s){return String(s??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function setLoading(on,text='Preparando análise...'){loading.classList.toggle('show',on);$('loadingText').textContent=text}
function renderResults(data){extracted=data;fields.innerHTML=FIELDS.map(([key,label],idx)=>{const x=data?.[key]||{};const val=x.value??'';const has=val!==''&&val!==null&&val!==undefined;return `<article class="field"><div class="field-top"><span class="field-name">${idx+1}. ${label}</span><div class="field-actions"><button class="icon-btn" title="Copiar" data-copy="${key}">⧉</button><button class="icon-btn" title="Ver origem no PDF" data-source="${key}" ${has?'':'disabled'}>▣</button></div></div><div class="value ${has?'':'empty'}">${has?escapeHtml(val):'Não localizado com segurança'}</div>${x.confidence!=null?`<div class="confidence">Confiança da extração: ${Math.round(x.confidence*100)}%</div>`:''}${x.warning?`<div class="warning">⚠ ${escapeHtml(x.warning)}</div>`:''}</article>`}).join('');result.classList.add('show');fields.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const v=extracted?.[b.dataset.copy]?.value??'';if(v){await navigator.clipboard.writeText(String(v));b.textContent='✓';setTimeout(()=>b.textContent='⧉',900)}});fields.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>showSource(extracted?.[b.dataset.source]));}
async function analyzeFiles(){if(!files.length)return;setLoading(true,'Enviando PDF(s) para análise segura...');showStatus('A IA está lendo os documentos. Não feche esta página durante a análise.','info');analyze.disabled=true;try{const fd=new FormData();files.forEach(f=>fd.append('files',f,f.name));const res=await fetch(AI_ENDPOINT,{method:'POST',body:fd});let body={};try{body=await res.json()}catch{}if(!res.ok)throw new Error(body.error||`Servidor de IA indisponível (${res.status}).`);renderResults(body.fields||body);showStatus('Análise concluída. Revise os campos antes de usar as informações em um processo real.','ok')}catch(e){console.error(e);showStatus('Não foi possível concluir a análise: '+e.message+' A conexão com a IA precisa estar publicada em um servidor seguro.','error');result.classList.remove('show')}finally{setLoading(false);analyze.disabled=!files.length}}
analyze.onclick=analyzeFiles;
$('copyAll').onclick=async()=>{const text=FIELDS.map(([k,l])=>`${l}: ${extracted?.[k]?.value??''}`).join('\n');await navigator.clipboard.writeText(text);$('copyAll').textContent='✓ Copiado';setTimeout(()=>$('copyAll').textContent='Copiar tudo',1200)};
async function showSource(info){if(!info?.source?.file_index||!info?.source?.page){showStatus('A IA não forneceu uma origem visual confiável para este campo. O dado não deve ser tratado como validado.','error');return}const idx=info.source.file_index-1;if(!files[idx])return;const pageNum=info.source.page;const pdf=await pdfjsLib.getDocument({data:await files[idx].arrayBuffer()}).promise;const page=await pdf.getPage(pageNum);const viewport=page.getViewport({scale:1.45});const wrap=document.createElement('div');wrap.className='page';wrap.style.width=viewport.width+'px';wrap.style.height=viewport.height+'px';const canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;wrap.appendChild(canvas);const ctx=canvas.getContext('2d');await page.render({canvasContext:ctx,viewport}).promise;$('viewer').innerHTML='';$('viewer').appendChild(wrap);$('modalTitle').textContent=`${info.source.filename||files[idx].name} • Página ${pageNum} • ${info.source.quote||'origem localizada'}`;if(info.source.bbox){const b=info.source.bbox;const left=b.x*viewport.width,top=b.y*viewport.height,w=b.width*viewport.width,h=b.height*viewport.height;const hi=document.createElement('div');hi.className='highlight';Object.assign(hi.style,{left:left+'px',top:top+'px',width:w+'px',height:h+'px'});const lab=document.createElement('div');lab.className='page-label';lab.textContent='Origem detectada pela IA';hi.appendChild(lab);wrap.appendChild(hi)}$('modal').classList.add('show')}
$('closeModal').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
showStatus('Selecione os PDFs do processo. A chave de IA não fica exposta no navegador.','info');
</script>
<script type="module" src="./ai-auth-bridge.js?v=20260903b"></script>
</body></html>
