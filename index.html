<title>Abridor de Processos | Costalog</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#7f081d,#c8102e,#ef294d);display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}.bg{position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.16),transparent 25%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.12),transparent 28%);animation:bg 8s ease-in-out infinite alternate}.card{position:relative;z-index:2;width:min(1050px,100%);min-height:610px;background:#fff;border-radius:28px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 30px 90px rgba(0,0,0,.28);animation:show .7s ease both}.left{padding:55px;background:linear-gradient(150deg,#ef294d,#c8102e 55%,#8b081e);color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative}.left:after{content:"";position:absolute;width:500px;height:500px;border:1px solid rgba(255,255,255,.16);border-radius:50%;right:-280px;top:-180px;animation:spin 18s linear infinite}.logo{position:relative;z-index:2;width:250px;height:105px;background:#fff;border-radius:20px;padding:12px 22px;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 35px rgba(0,0,0,.2);margin-bottom:36px;animation:pulse 4s ease-in-out infinite}.logo img{width:100%;height:100%;object-fit:contain;display:block}.tag{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.8}.left h1{position:relative;z-index:2;font-size:46px;line-height:1.02;margin:12px 0 20px}.left p{position:relative;z-index:2;max-width:430px;line-height:1.7;color:rgba(255,255,255,.86);font-size:15px}.right{padding:60px;display:flex;align-items:center}.form{width:100%;max-width:400px;margin:auto}.mini{width:145px;height:45px;margin-bottom:30px}.mini img{width:100%;height:100%;object-fit:contain;object-position:left}.form h2{font-size:34px;margin:0 0 10px;color:#171717}.sub{color:#707070;line-height:1.6;font-size:14px;margin:0 0 30px}.label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}.input{width:100%;height:58px;border:1px solid #ddd;border-radius:14px;padding:0 17px;font-size:15px;outline:none;transition:.2s}.input:focus{border-color:#c8102e;box-shadow:0 0 0 4px rgba(200,16,46,.1)}button{width:100%;height:58px;margin-top:20px;border:0;border-radius:14px;background:#c8102e;color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 12px 25px rgba(200,16,46,.25);transition:.2s}button:hover{transform:translateY(-2px);box-shadow:0 17px 32px rgba(200,16,46,.32)}.msg{height:25px;text-align:center;color:#c8102e;font-size:12px;font-weight:700;margin-top:12px}.hint{text-align:center;border-top:1px solid #eee;padding-top:18px;margin-top:18px;color:#888;font-size:11px;line-height:1.5}@keyframes show{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:translateY(-3px)}}@keyframes bg{to{transform:scale(1.05)}}@media(max-width:760px){body{padding:0}.card{min-height:100vh;border-radius:0;grid-template-columns:1fr}.left{min-height:390px;padding:35px}.left h1{font-size:35px}.logo{width:210px;height:85px}.right{padding:40px 28px}.mini{display:none}}
</style>
</head>
<body><div class="bg"></div><main class="card"><section class="left"><div class="logo"><img src="./Design%20sem%20nome%20%2844%29%20-%20Copia%20-%20Copia.png?v=20260902" alt="Logo oficial COSTALOG"></div><div class="tag">COSTALOG • SISTEMA INTERNO</div><h1>Abridor de<br>Processos</h1><p>Acesso rápido, moderno e seguro ao ambiente de processos da Costalog.</p></section><section class="right"><form class="form" id="login"><div class="mini"><img src="./Design%20sem%20nome%20%2844%29%20-%20Copia%20-%20Copia.png?v=20260902" alt="Logo COSTALOG"></div><h2>Olá! 👋</h2><p class="sub">Informe seu nome para entrar no Abridor de Processos.</p><label class="label" for="name">Seu nome</label><input class="input" id="name" type="text" maxlength="80" placeholder="Digite seu nome completo" autocomplete="name" required><button type="submit" id="btn">Entrar no sistema →</button><div class="msg" id="msg"></div><div class="hint">Acesso simplificado para uso interno.<br><strong>Não é necessário informar senha.</strong></div></form></section></main><script>const f=document.getElementById('login'),n=document.getElementById('name'),m=document.getElementById('msg'),b=document.getElementById('btn');const old=sessionStorage.getItem('abridor_nome');if(old)n.value=old;f.onsubmit=e=>{e.preventDefault();let v=n.value.trim();if(v.length<2){m.textContent='Digite seu nome para continuar.';n.focus();return}sessionStorage.setItem('abridor_nome',v);b.disabled=true;b.textContent='Entrando...';setTimeout(()=>location.href='inicio.html',500)};</script></body></html>
