<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abridor de Processos | Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#c8102e;--red2:#a50d25;--ink:#171717;--muted:#747474;--line:#e8e8e8;--bg:#f4f5f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px}
.shell{width:min(1040px,100%);min-height:620px;background:#fff;border-radius:24px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 25px 70px rgba(0,0,0,.12)}
.brand{position:relative;overflow:hidden;background:linear-gradient(145deg,#d71939,#b20f2c 58%,#860b22);color:#fff;padding:58px;display:flex;flex-direction:column;justify-content:space-between}.brand:before,.brand:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.14);border-radius:50%}.brand:before{width:450px;height:450px;right:-260px;top:-130px}.brand:after{width:560px;height:560px;left:-410px;bottom:-300px}.content,.footer{position:relative;z-index:1}.logo{width:62px;height:62px;border:2px solid rgba(255,255,255,.9);border-radius:16px;display:grid;place-items:center;font-size:25px;font-weight:800;margin-bottom:30px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;opacity:.8}.brand h1{font-size:42px;line-height:1.04;letter-spacing:-.045em;margin:12px 0 18px}.brand p{max-width:390px;color:rgba(255,255,255,.84);line-height:1.65;margin:0}.footer{font-size:12px;color:rgba(255,255,255,.68)}
.form-side{padding:58px clamp(32px,6vw,72px);display:flex;align-items:center}.form{width:100%;max-width:390px;margin:auto}.form h2{font-size:30px;letter-spacing:-.035em;margin:0 0 8px}.subtitle{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 34px}.field{margin-bottom:22px}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input{width:100%;height:54px;border:1px solid var(--line);border-radius:12px;padding:0 16px;font:inherit;font-size:14px;outline:none;transition:.2s;background:#fff}input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.09)}input::placeholder{color:#aaa}.submit{width:100%;height:54px;border:0;border-radius:12px;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:.2s}.submit:hover{background:var(--red2);transform:translateY(-1px)}.submit:disabled{opacity:.7;cursor:not-allowed;transform:none}.message{min-height:22px;margin-top:14px;text-align:center;font-size:12px;color:var(--red)}.hint{margin-top:26px;padding-top:20px;border-top:1px solid #eee;text-align:center;color:#8a8a8a;font-size:11px;line-height:1.5}.user-icon{position:relative}.user-icon:before{content:"";position:absolute;right:17px;top:17px;width:17px;height:17px;border:1.5px solid #aaa;border-radius:50%}.user-icon:after{content:"";position:absolute;right:14px;top:37px;width:23px;height:11px;border:1.5px solid #aaa;border-bottom:0;border-radius:14px 14px 0 0}.user-icon input{padding-right:52px}
@media(max-width:760px){body{padding:0}.shell{min-height:100vh;border-radius:0;grid-template-columns:1fr}.brand{min-height:285px;padding:34px}.brand h1{font-size:32px}.footer{display:none}.form-side{padding:42px 28px}}
</style>
</head>
<body>
<main class="shell">
<section class="brand">
<div class="content"><div class="logo">AP</div><div class="eyebrow">Costalog</div><h1>Abridor de<br>Processos</h1><p>Entre no sistema de forma rápida e simples. Informe seu nome para acessar sua área de trabalho.</p></div>
<div class="footer">Sistema interno • Acesso autorizado</div>
</section>
<section class="form-side">
<form class="form" id="loginForm">
<h2>Olá! 👋</h2>
<p class="subtitle">Para começar, informe seu nome abaixo.</p>
<div class="field user-icon"><label for="name">Seu nome</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Digite seu nome completo" maxlength="80" required></div>
<button class="submit" id="submit" type="submit">Entrar no sistema</button>
<div class="message" id="message" role="alert"></div>
<div class="hint">Acesso simplificado para uso interno.<br>Não é necessário informar senha.</div>
</form>
</section>
</main>
<script>
const form=document.getElementById('loginForm');const nameInput=document.getElementById('name');const message=document.getElementById('message');const submit=document.getElementById('submit');
form.addEventListener('submit',e=>{e.preventDefault();const name=nameInput.value.trim();message.textContent='';if(name.length<2){message.textContent='Digite seu nome para continuar.';nameInput.focus();return;}sessionStorage.setItem('abridor_nome',name);submit.disabled=true;submit.textContent='Entrando...';setTimeout(()=>{window.location.href='inicio.html';},450);});
</script>
</body>
</html>
