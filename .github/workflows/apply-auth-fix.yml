name: Aplicar correção de autenticação
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Centralizar autenticação no módulo auth-fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove o módulo Firebase inline antigo para evitar dois listeners de login.
          s = re.sub(
              r'<script type="module">\s*import \{ initializeApp \}.*?</script>',
              '',
              s,
              flags=re.S
          )

          tag = '<script type="module" src="./auth-fix.js?v=20260903c"></script>'
          s = re.sub(r'<script type="module" src="\./auth-fix\.js\?v=[^"]+"></script>\s*', '', s)
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: centralizar fluxo de login Firebase"
          git push
