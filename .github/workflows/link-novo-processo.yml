name: Ligar abertura de processo na Home
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar atalhos da Home
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('inicio.html')
          s = p.read_text(encoding='utf-8')
          old = s
          s = s.replace('href="#novo"', 'href="abrir-processo.html"')
          s = s.replace('onclick="document.getElementById(\'novo\').scrollIntoView({behavior:\'smooth\'})"', 'onclick="location.href=\'abrir-processo.html\'"')
          s = s.replace('onclick="document.getElementById("novo").scrollIntoView({behavior:"smooth"})"', 'onclick="location.href=\'abrir-processo.html\'"')
          if s != old:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inicio.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: conectar atalhos de novo processo"
          git push
