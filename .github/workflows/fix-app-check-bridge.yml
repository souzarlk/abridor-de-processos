name: Corrigir App Check da IA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ativar ponte Firebase AI + App Check no abridor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('abrir-processo.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script type="module" src="./ai-auth-bridge.js?v=20260903a"></script>'
          if tag not in s:
              marker = '<script type="module">\nimport * as pdfjsLib'
              if marker not in s:
                  raise SystemExit('Não encontrei o ponto seguro para inserir o bridge.')
              s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remover mensagem enganosa de servidor no erro
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('abrir-processo.html')
          s = p.read_text(encoding='utf-8')
          old = "showStatus('Não foi possível concluir a análise: '+e.message+' A conexão com a IA precisa estar publicada em um servidor seguro.','error');"
          new = "showStatus('Não foi possível concluir a análise: '+e.message,'error');"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commitar correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abrir-processo.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "fix: inicializar App Check antes da IA"
          git push
